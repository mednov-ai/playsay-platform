server:
  port: 8089

spring:
  application:
    name: worksheet-import-service
  servlet:
    multipart:
      max-file-size: ${PLAYSAY_WORKSHEET_MULTIPART_MAX_FILE_SIZE:64MB}
      max-request-size: ${PLAYSAY_WORKSHEET_MULTIPART_MAX_REQUEST_SIZE:128MB}
      file-size-threshold: ${PLAYSAY_WORKSHEET_MULTIPART_FILE_SIZE_THRESHOLD:1MB}
  datasource:
    url: ${PLAYSAY_WORKSHEET_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/worksheet_import}
    username: ${PLAYSAY_WORKSHEET_DB_USERNAME:worksheet_import_app}
    password: ${PLAYSAY_WORKSHEET_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_WORKSHEET_LIQUIBASE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PLAYSAY_AUTH_ISSUER_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay}
          jwk-set-uri: ${PLAYSAY_AUTH_JWK_SET_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

logging:
  level:
    org.hibernate.orm.connections.pooling: warn

playsay:
  worksheet-import:
    enabled: ${PLAYSAY_WORKSHEET_IMPORT_ENABLED:false}
    service-token: ${PLAYSAY_WORKSHEET_SERVICE_TOKEN:}
    packet:
      max-pages: ${PLAYSAY_WORKSHEET_MAX_PAGES:100}
      max-bytes: ${PLAYSAY_WORKSHEET_MAX_PACKET_BYTES:134217728}
      max-image-bytes: ${PLAYSAY_WORKSHEET_MAX_IMAGE_BYTES:12582912}
    pdf:
      max-bytes: ${PLAYSAY_WORKSHEET_PDF_MAX_BYTES:67108864}
      max-pages: ${PLAYSAY_WORKSHEET_PDF_MAX_PAGES:50}
      max-page-pixels: ${PLAYSAY_WORKSHEET_PDF_MAX_PAGE_PIXELS:40000000}
      max-total-pixels: ${PLAYSAY_WORKSHEET_PDF_MAX_TOTAL_PIXELS:250000000}
      render-dpi: ${PLAYSAY_WORKSHEET_PDF_RENDER_DPI:144}
      timeout: ${PLAYSAY_WORKSHEET_PDF_TIMEOUT:PT45S}
      max-memory-bytes: ${PLAYSAY_WORKSHEET_PDF_MAX_MEMORY_BYTES:268435456}
    analysis:
      provider: ${PLAYSAY_WORKSHEET_AI_PROVIDER:stub}
      api-key: ${PLAYSAY_AI_OPENAI_API_KEY:}
      model: ${PLAYSAY_AI_OPENAI_MODEL:gpt-5.4-mini}
      base-url: ${PLAYSAY_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      reasoning-effort: ${PLAYSAY_AI_WORKSHEET_REASONING:medium}
      max-vision-bytes: ${PLAYSAY_WORKSHEET_AI_MAX_VISION_BYTES:20971520}
      max-response-bytes: ${PLAYSAY_WORKSHEET_AI_MAX_RESPONSE_BYTES:4194304}
      request-timeout: ${PLAYSAY_WORKSHEET_AI_REQUEST_TIMEOUT:PT75S}
      concurrency: ${PLAYSAY_WORKSHEET_ANALYSIS_CONCURRENCY:2}
      max-retries: ${PLAYSAY_WORKSHEET_ANALYSIS_MAX_RETRIES:3}
      lease: ${PLAYSAY_WORKSHEET_ANALYSIS_LEASE:PT5M}
      poll-delay: ${PLAYSAY_WORKSHEET_ANALYSIS_POLL_DELAY:PT2S}
      confidence-threshold: ${PLAYSAY_WORKSHEET_CONFIDENCE_THRESHOLD:0.75}
    retention:
      duration: ${PLAYSAY_WORKSHEET_RETENTION:PT72H}
      cleanup-delay: ${PLAYSAY_WORKSHEET_CLEANUP_DELAY:PT1H}
    storage:
      provider: ${PLAYSAY_WORKSHEET_STORAGE_PROVIDER:memory}
      endpoint: ${PLAYSAY_WORKSHEET_S3_ENDPOINT:}
      region: ${PLAYSAY_WORKSHEET_S3_REGION:us-east-1}
      bucket: ${PLAYSAY_WORKSHEET_S3_BUCKET:playsay-worksheet-staging}
      access-key: ${PLAYSAY_WORKSHEET_S3_ACCESS_KEY:}
      secret-key: ${PLAYSAY_WORKSHEET_S3_SECRET_KEY:}
      path-style-access: ${PLAYSAY_WORKSHEET_S3_PATH_STYLE_ACCESS:true}
      create-bucket: ${PLAYSAY_WORKSHEET_S3_CREATE_BUCKET:false}
