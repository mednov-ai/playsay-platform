openapi: 3.1.0
info:
  title: Honey School API Gateway
  description: Public contract for the Honey School API Gateway.
  version: 0.1.0
servers:
- url: /api
  description: Honey School web-app API proxy
paths:
  /worksheet-imports/{sessionId}/review:
    put:
      tags:
      - worksheet-import-controller
      operationId: replaceWorksheetImportReview
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonNode"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
  /users/me/profile:
    get:
      tags:
      - Users
      summary: Current application user profile
      description: Returns the app-level profile for the current Keycloak user.
      operationId: getMyUserProfile
      responses:
        "200":
          description: Current app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    put:
      tags:
      - Users
      summary: Update current application user profile
      description: Updates editable profile fields for the current Keycloak user.
      operationId: updateMyUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
        required: true
      responses:
        "200":
          description: Updated app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Invalid profile payload
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    delete:
      tags:
      - Users
      summary: Delete current application user profile
      description: Deletes editable app-level profile data for the current Keycloak
        user.
      operationId: deleteMyUserProfile
      responses:
        "204":
          description: Current app-level user profile deleted
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
  /teacher/students/{subject}/lesson-translation-permission:
    put:
      tags:
      - teacher-management-controller
      operationId: updateLessonTranslationPermission
      parameters:
      - name: subject
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentLessonTranslationPermissionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherStudentResponse"
  /schedule/lessons/{lessonId}:
    get:
      tags:
      - Schedule
      summary: Get scheduled lesson
      description: Returns a scheduled lesson visible to the current user.
      operationId: getScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Scheduled lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Schedule
      summary: Update scheduled lesson
      description: Updates a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: updateScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledLessonRequest"
        required: true
      responses:
        "200":
          description: Scheduled lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "400":
          description: Invalid scheduled lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Schedule
      summary: Delete scheduled lesson
      description: Deletes a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: deleteScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Scheduled lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material-submission:
    get:
      tags:
      - Materials
      summary: Get current material answer snapshot
      description: Returns the current user's saved answers for the material attached
        to a scheduled lesson.
      operationId: getScheduledLessonMaterialSubmission
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSubmissionResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Save current material answer snapshot
      description: Creates or updates the current user's answers for the material
        attached to a scheduled lesson.
      operationId: saveScheduledLessonMaterialSubmission
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialSubmissionRequest"
        required: true
      responses:
        "200":
          description: Material submission saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSubmissionResponse"
        "400":
          description: Invalid submission payload
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material-annotation:
    get:
      tags:
      - Materials
      summary: Get shared material annotation layer
      description: Returns the shared drawing layer for the material attached to a
        scheduled lesson.
      operationId: getScheduledLessonMaterialAnnotation
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAnnotationResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Save shared material annotation layer
      description: Creates or updates the shared drawing layer for the material attached
        to a scheduled lesson.
      operationId: saveScheduledLessonMaterialAnnotation
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialAnnotationRequest"
        required: true
      responses:
        "200":
          description: Material annotation saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAnnotationResponse"
        "400":
          description: Invalid annotation payload
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/collaboration-documents/{documentId}/snapshot:
    put:
      tags:
      - Collaboration
      summary: Save collaboration document snapshot
      description: Stores the latest normalized snapshot for a collaboration document
        and increments its version.
      operationId: saveCollaborationDocumentSnapshot
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCollaborationSnapshotRequest"
        required: true
      responses:
        "200":
          description: Snapshot saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationDocumentResponse"
        "400":
          description: Invalid snapshot
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot modify the document
        "404":
          description: Collaboration document not found
      security:
      - bearerAuth: []
  /me/assignments/{assignmentId}/submission:
    get:
      tags:
      - Assignments
      summary: Get my homework answer snapshot
      description: Returns the current student's saved answers for a homework assignment.
      operationId: getMyHomeworkAssignmentSubmission
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmissionResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Assignments
      summary: Save my homework answer snapshot
      description: Creates or updates the current student's answers and automatic
        score/error snapshot for homework.
      operationId: saveMyHomeworkAssignmentSubmission
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialSubmissionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmissionResponse"
      security:
      - bearerAuth: []
  /materials/{materialId}:
    get:
      tags:
      - Materials
      summary: Get lesson material
      description: Returns a visible lesson material.
      operationId: getMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Lesson material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Material not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Update lesson material
      description: Updates a structured lesson material. Requires material owner or
        ADMIN role.
      operationId: updateMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonMaterialRequest"
        required: true
      responses:
        "200":
          description: Lesson material updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "400":
          description: Invalid material payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot edit material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Materials
      summary: Archive lesson material
      description: Archives a lesson material. Requires material owner or ADMIN role.
      operationId: archiveMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Lesson material archived
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot archive material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
  /courses/{courseId}:
    get:
      tags:
      - Courses
      summary: Get course
      description: Returns a single course. Unpublished courses are visible only to
        teachers/admins.
      operationId: getCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Courses
      summary: Update course
      description: Updates a course. Requires TEACHER or ADMIN role.
      operationId: updateCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
        required: true
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          description: Invalid course payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course
      description: Deletes a course and its draft lesson templates. Requires TEACHER
        or ADMIN role.
      operationId: deleteCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
  /courses/{courseId}/topics/{topicId}:
    put:
      tags:
      - Curriculum topics
      summary: Update curriculum topic
      description: Updates a controlled curriculum topic. Requires TEACHER or ADMIN
        role.
      operationId: updateCurriculumTopic
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: topicId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumTopicRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumTopicResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Curriculum topics
      summary: Delete curriculum topic
      description: Deletes a controlled curriculum topic. Requires TEACHER or ADMIN
        role.
      operationId: deleteCurriculumTopic
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: topicId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /courses/{courseId}/lessons/{lessonId}:
    put:
      tags:
      - Courses
      summary: Update course lesson
      description: Updates a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: updateCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLessonRequest"
        required: true
      responses:
        "200":
          description: Course lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
        "400":
          description: Invalid course lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course lesson
      description: Deletes a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: deleteCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
  /courses/{courseId}/lessons/{lessonId}/cards:
    put:
      tags:
      - Courses
      summary: Replace course lesson cards
      description: Replaces the ordered reusable card list for a lesson template.
        Requires TEACHER or ADMIN role.
      operationId: replaceCourseLessonCards
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonTemplateCardsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
      security:
      - bearerAuth: []
  /chat/push/subscription:
    put:
      tags:
      - chat-controller
      operationId: upsertPushSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPushSubscriptionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPushSubscriptionResponse"
    delete:
      tags:
      - chat-controller
      operationId: removePushSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPushUnsubscribeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPushSubscriptionResponse"
  /chat/conversations/{conversationId}/read:
    put:
      tags:
      - chat-controller
      operationId: markRead
      parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkChatReadRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReadReceiptResponse"
  /admin/user-management/users/{subject}/roles:
    put:
      tags:
      - user-management-controller
      operationId: updateRoles
      parameters:
      - name: subject
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRolesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementUser"
  /admin/user-management/students/{subject}/teacher:
    put:
      tags:
      - admin-delegation-controller
      operationId: assignTeacher
      parameters:
      - name: subject
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPrimaryTeacherRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherStudentResponse"
    delete:
      tags:
      - admin-delegation-controller
      operationId: removeTeacher
      parameters:
      - name: subject
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /worksheet-imports:
    post:
      tags:
      - worksheet-import-controller
      summary: "Create a worksheet import from photos, scans or PDFs"
      operationId: createWorksheetImport
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  $ref: "#/components/schemas/WorksheetImportCreateRequest"
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - files
              - metadata
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
      security:
      - bearerAuth: []
  /worksheet-imports/{sessionId}/retry:
    post:
      tags:
      - worksheet-import-controller
      operationId: retryWorksheetImportAnalysis
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
  /worksheet-imports/{sessionId}/materialize:
    post:
      tags:
      - worksheet-import-controller
      operationId: materializeWorksheetImport
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorksheetMaterializeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorksheetMaterializeResponse"
  /worksheet-imports/{sessionId}/continue-manually:
    post:
      tags:
      - worksheet-import-controller
      operationId: continueWorksheetImportManually
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JsonNode"
  /webhooks/unisender:
    get:
      tags:
      - unisender-webhook-proxy-controller
      operationId: readiness
      responses:
        "200":
          description: OK
    post:
      tags:
      - unisender-webhook-proxy-controller
      operationId: webhook
      responses:
        "200":
          description: OK
  /webhooks/mailjet:
    post:
      tags:
      - mailjet-webhook-proxy-controller
      operationId: webhook_1
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /teacher/students/attach:
    post:
      tags:
      - teacher-management-controller
      operationId: attach
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachStudentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherStudentResponse"
  /teacher/delegations:
    get:
      tags:
      - teacher-management-controller
      operationId: delegations
      parameters:
      - name: direction
        in: query
        required: false
        schema:
          type: string
          default: granted
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherDelegationResponse"
    post:
      tags:
      - teacher-management-controller
      operationId: createDelegation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDelegationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherDelegationResponse"
