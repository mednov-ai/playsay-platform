server:
  port: 8082

spring:
  application:
    name: media-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

playsay:
  media-service:
    service-token: ${PLAYSAY_MEDIA_SERVICE_TOKEN:}
    session-ttl-seconds: ${PLAYSAY_MEDIA_SERVICE_SESSION_TTL_SECONDS:900}
    max-upstream-range-bytes: ${PLAYSAY_MEDIA_SERVICE_MAX_UPSTREAM_RANGE_BYTES:1048576}
    max-thumbnail-bytes: ${PLAYSAY_MEDIA_SERVICE_MAX_THUMBNAIL_BYTES:5242880}
    ytdlp-path: ${PLAYSAY_MEDIA_SERVICE_YTDLP_PATH:yt-dlp}
    ytdlp-plugin-directory: ${PLAYSAY_MEDIA_SERVICE_YTDLP_PLUGIN_DIRECTORY:/usr/local/lib}
    ytdlp-js-runtime: ${PLAYSAY_MEDIA_SERVICE_YTDLP_JS_RUNTIME:deno:/usr/local/bin/deno}
    youtube-pot-enabled: ${PLAYSAY_YOUTUBE_POT_ENABLED:false}
    youtube-pot-provider-base-url: ${PLAYSAY_YOUTUBE_POT_PROVIDER_BASE_URL:http://127.0.0.1:4416}
    youtube-pot-allowed-video-ids: ${PLAYSAY_YOUTUBE_POT_ALLOWED_VIDEO_IDS:}
    youtube-pot-player-clients: ${PLAYSAY_YOUTUBE_POT_PLAYER_CLIENTS:mweb}
    youtube-pot-sleep-requests-seconds: ${PLAYSAY_YOUTUBE_POT_SLEEP_REQUESTS_SECONDS:1}
    ffmpeg-path: ${PLAYSAY_MEDIA_SERVICE_FFMPEG_PATH:/usr/local/bin/ffmpeg}
    youtube-cache-enabled: ${PLAYSAY_YOUTUBE_CACHE_ENABLED:false}
    cache-download-timeout-seconds: ${PLAYSAY_MEDIA_SERVICE_CACHE_DOWNLOAD_TIMEOUT_SECONDS:600}
    cache-max-video-bytes: ${PLAYSAY_MEDIA_SERVICE_CACHE_MAX_VIDEO_BYTES:262144000}
    cache-temp-directory: ${PLAYSAY_MEDIA_SERVICE_CACHE_TEMP_DIRECTORY:/tmp/playsay-media-cache}
  storage:
    provider: ${PLAYSAY_STORAGE_PROVIDER:memory}
    s3:
      endpoint: ${PLAYSAY_S3_ENDPOINT:}
      region: ${PLAYSAY_S3_REGION:us-east-1}
      bucket: ${PLAYSAY_S3_BUCKET:playsay-material-assets}
      access-key: ${PLAYSAY_S3_ACCESS_KEY:}
      secret-key: ${PLAYSAY_S3_SECRET_KEY:}
      path-style-access: ${PLAYSAY_S3_PATH_STYLE_ACCESS:true}
      create-bucket: ${PLAYSAY_S3_CREATE_BUCKET:false}
