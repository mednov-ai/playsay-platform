server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${PLAYSAY_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/playsay}
    username: ${PLAYSAY_DB_USERNAME:playsay_app}
    password: ${PLAYSAY_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_PAYMENT_LIQUIBASE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.orm.connections.pooling: warn

playsay:
  payment-service:
    service-token: ${PLAYSAY_PAYMENT_SERVICE_TOKEN:}
    public-base-url: ${PLAYSAY_PAYMENT_PUBLIC_BASE_URL:https://online.play-and-say.ru}
    provider: ${PLAYSAY_PAYMENT_PROVIDER:disabled}
    yookassa:
      api-url: ${PLAYSAY_YOOKASSA_API_URL:https://api.yookassa.ru/v3}
      shop-id: ${PLAYSAY_YOOKASSA_SHOP_ID:}
      secret-key: ${PLAYSAY_YOOKASSA_SECRET_KEY:}
