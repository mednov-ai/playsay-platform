techniqueAdvice.chord.primary=Répétez {0} plus lentement et régulièrement : cet accord a causé le plus d''erreurs de précision.
techniqueAdvice.chord.drill=Faites un court exercice ciblé sur {0}.
techniqueAdvice.character.primary=Vérifiez le mouvement vers la touche {0} : gardez la main détendue et ne précipitez pas la frappe.
