openapi: 3.1.0
info:
  title: Honey School Vocabulary API
  version: 0.3.0
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/vocabulary/translation-suggestions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslationSuggestionRequest' }
      responses:
        '200':
          description: Editable translation and usage variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranslationSuggestion' }
  /api/vocabulary/entries:
    get:
      parameters:
        - { in: query, name: ownerSubject, schema: { type: string, maxLength: 255 } }
        - { in: query, name: lessonId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Active entries belonging to the authorized learner
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VocabularyEntry' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEntry' }
      responses:
        '201':
          description: Created or merged vocabulary entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyEntry' }
  /api/vocabulary/entries/{entryId}:
    parameters:
      - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEntry' }
      responses:
        '200':
          description: Updated owner-aware entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyEntry' }
    delete:
      responses:
        '204': { description: Archived owner-aware entry }
  /api/vocabulary/entries/{entryId}/media:
    get:
      summary: Resolve approved sense media or trigger a non-blocking first-use request
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Entry-specific media state, content placeholder, and approved alternatives', content: { application/json: { schema: { $ref: '#/components/schemas/MediaView' } } } }
  /api/vocabulary/entries/{entryId}/media/regenerate:
    post:
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Distinct regeneration candidate queued without replacing current approval, content: { application/json: { schema: { $ref: '#/components/schemas/MediaView' } } } }
        '429': { description: Per-actor and per-sense regeneration rate limit reached }
  /api/vocabulary/entries/{entryId}/media/override:
    put:
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaOverride' } } } }
      responses:
        '200': { description: Personal hide/default/approved-alternative selection, content: { application/json: { schema: { $ref: '#/components/schemas/MediaView' } } } }
  /api/vocabulary/entries/{entryId}/media/assets/{assetId}/report:
    post:
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: assetId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { reasonCode: { type: string, maxLength: 64, default: WRONG_SENSE } } } } } }
      responses:
        '200': { description: Idempotent wrong-image report plus personal hide, content: { application/json: { schema: { $ref: '#/components/schemas/MediaView' } } } }
  /api/vocabulary/entries/{entryId}/media/assets/{assetId}/content:
    get:
      summary: Authorized opaque delivery of an approved immutable asset revision
      parameters:
        - { in: path, name: entryId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: assetId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Privately cached image bytes, content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        '403': { description: Asset is not authorized for this entry }
  /api/vocabulary/media/candidates:
    get:
      summary: Reviewer-only generated candidate queue
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Reviewable candidates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } } } } }
  /api/vocabulary/media/candidates/{assetId}:
    get:
      parameters: [{ in: path, name: assetId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Candidate provenance, safety, alternative text and review history', content: { application/json: { schema: { $ref: '#/components/schemas/MediaAsset' } } } }
    patch:
      parameters: [{ in: path, name: assetId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MediaReview' } } } }
      responses:
        '200': { description: Approved or rejected immutable candidate, content: { application/json: { schema: { $ref: '#/components/schemas/MediaAsset' } } } }
  /api/vocabulary/media/candidates/{assetId}/content:
    get:
      parameters: [{ in: path, name: assetId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Reviewer-only no-store candidate bytes, content: { image/png: { schema: { type: string, format: binary } } } }
  /api/vocabulary/media/senses/{senseId}/imageability:
    patch:
      parameters: [{ in: path, name: senseId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [imageability], properties: { imageability: { $ref: '#/components/schemas/Imageability' } } } } } }
      responses:
        '204': { description: Sense imageability or generation suppression updated }
  /api/vocabulary/overview:
    get:
      summary: Compact lesson and recent vocabulary preview
      parameters:
        - { in: query, name: ownerSubject, schema: { type: string, maxLength: 255 } }
        - { in: query, name: lessonId, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        '200':
          description: Lesson-first preview followed by recent entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyOverview' }
        '403': { description: Caller cannot access the learner }
  /api/vocabulary/practice:
    get:
      deprecated: true
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 32 } }
      responses:
        '200':
          description: Legacy current learner word set
          content:
            application/json:
              schema: { type: object, required: [entries], properties: { entries: { type: array, items: { $ref: '#/components/schemas/VocabularyEntry' } } } }
  /api/vocabulary/learners:
    get:
      summary: Learners whose vocabulary the teacher may manage globally
      parameters:
        - { in: query, name: query, schema: { type: string } }
      responses:
        '200':
          description: Primary-teacher and active MANUAL-delegate learners only
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LearnerSummary' } }
  /api/vocabulary/dashboard:
    get:
      parameters:
        - { in: query, name: ownerSubject, schema: { type: string, maxLength: 255 } }
        - { in: query, name: lessonId, schema: { type: string, format: uuid } }
        - { in: query, name: query, schema: { type: string } }
      responses:
        '200':
          description: Owner-aware vocabulary and skill-state dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyDashboard' }
  /api/vocabulary/practices/preview:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSettings' }
      responses:
        '200':
          description: Deterministic queue preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticePreview' }
  /api/vocabulary/practices/recommended-preview:
    post:
      summary: Preview a balanced, explainable learner practice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSettings' }
      responses:
        '200':
          description: Deterministic recommended preview within the requested budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticePreview' }
  /api/vocabulary/selection-recipes:
    get:
      responses:
        '200':
          description: Dynamic recipes owned by the current learner
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SelectionRecipe' } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectionRecipeRequest' }
      responses:
        '201':
          description: Recipe created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectionRecipe' }
  /api/vocabulary/selection-recipes/{recipeId}:
    parameters:
      - { in: path, name: recipeId, required: true, schema: { type: string, format: uuid } }
    get:
      responses:
        '200':
          description: Current dynamic recipe definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectionRecipe' }
        '404': { description: Recipe absent or not owned by the caller }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectionRecipeRequest' }
      responses:
        '200':
          description: Recipe revision updated without mutating launched plans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectionRecipe' }
    delete:
      responses:
        '204': { description: Recipe deleted without mutating launched plans }
  /api/vocabulary/practices:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSettings' }
      responses:
        '201':
          description: Published immutable personal sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Practice' }
  /api/vocabulary/practices/self:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSettings' }
      responses:
        '200':
          description: Existing covering assignment/self session or a new Today practice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Practice' }
  /api/vocabulary/practices/active:
    get:
      parameters:
        - { in: query, name: lessonId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Active live practice, if any
          content:
            application/json:
              schema:
                type: object
                required: [practice]
                properties:
                  practice: { anyOf: [{ $ref: '#/components/schemas/Practice' }, { type: 'null' }] }
  /api/vocabulary/practices/{practiceId}/status:
    patch:
      parameters:
        - { in: path, name: practiceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/PracticeStatus' }
      responses:
        '200':
          description: Practice status changed by its creator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Practice' }
  /api/vocabulary/practice-sessions:
    get:
      parameters:
        - { in: query, name: ownerSubject, schema: { type: string, maxLength: 255 } }
        - { in: query, name: lessonId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
      responses:
        '200':
          description: Authorized personal practice history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PracticeSession' } }
  /api/vocabulary/practice-sessions/{sessionId}:
    get:
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Immutable session snapshot and current item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSession' }
  /api/vocabulary/practice-sessions/{sessionId}/attempts:
    post:
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptRequest' }
      responses:
        '201':
          description: Idempotently committed attempt and next snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptResponse' }
        '409': { description: Stale revision or non-current item; reload session snapshot }
  /api/vocabulary/practice-sessions/{sessionId}/items/{itemId}/reveal:
    post:
      summary: Reveal the current self-rated flashcard without exposing other answers
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Expected answer for the current flashcard only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeReveal' }
  /api/vocabulary/practice-sessions/{sessionId}/key-set:
    get:
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exact immutable spelling set for the owning learner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeySet' }
  /api/vocabulary/practice-sessions/{sessionId}/key-acknowledgement:
    patch:
      summary: Persist the owning learner's monotonic position in an immutable Key target stream
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyAcknowledgementRequest' }
      responses:
        '200':
          description: Latest acknowledged target position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyAcknowledgement' }
        '409': { description: Snapshot is missing or target identity does not match the position }
  /api/vocabulary/practice-sessions/{sessionId}/hint:
    post:
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Creator-provided masked hint for the current LIVE item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSession' }
        '403': { description: Only the LIVE practice creator may give a hint }
  /api/vocabulary/practice-sessions/{sessionId}/help-request:
    post:
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Learner requested help for the current LIVE item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSession' }
        '403': { description: Only the session owner may request help during an active LIVE practice }
  /internal/vocabulary/assignments:
    post:
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeworkPreparation' }
      responses:
        '200': { description: Idempotently prepared sessions for an assignment }
        '403': { description: Invalid service token }
  /internal/vocabulary/practice-sessions/{sessionId}/key-results:
    post:
      security:
        - serviceToken: []
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyResult' }
      responses:
        '204': { description: Idempotently committed SPELLING-only results }
        '403': { description: Invalid service token }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    serviceToken: { type: apiKey, in: header, name: X-PlaySay-Service-Token }
  schemas:
    SourceType: { type: string, enum: [LESSON, HOMEWORK, MANUAL] }
    TranslationState: { type: string, enum: [MISSING, SUGGESTED, CONFIRMED] }
    EntryStatus: { type: string, enum: [ACTIVE, ARCHIVED] }
    Skill: { type: string, enum: [MEANING, FORM, SPELLING, CONTEXT] }
    LearningStage: { type: string, enum: [NEW, LEARNING, REVIEW, MASTERED] }
    Rating: { type: string, enum: [AGAIN, HARD, GOOD] }
    Delivery: { type: string, enum: [SELF, HOMEWORK, LIVE] }
    HomeworkCompletionPolicy: { type: string, enum: [MEANINGFUL_ACTIVITY, COMPLETE_SESSION, MASTERY_TARGET, TEACHER_REVIEW] }
    KeyMode: { type: string, enum: [WHOLE_WORDS, CHARACTER_NGRAMS, MIXED] }
    KeyTargetType: { type: string, enum: [WHOLE_WORD, CHARACTER_NGRAM] }
    Imageability: { type: string, enum: [UNKNOWN, IMAGEABLE, NON_IMAGEABLE, SUPPRESSED] }
    MediaAssetState: { type: string, enum: [GENERATING, CANDIDATE, APPROVED, REJECTED, FAILED, SUPERSEDED] }
    MediaSafetyState: { type: string, enum: [PENDING, SAFE, BLOCKED, PROVIDER_REJECTED, UNKNOWN] }
    MediaAsset:
      type: object
      required: [id, senseId, state, origin, safetyState, altText, decorative, createdAt, reviewHistory]
      properties:
        id: { type: string, format: uuid }
        senseId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/MediaAssetState' }
        contentUrl: { type: [string, 'null'] }
        contentType: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        checksumSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        origin: { type: string }
        generatorType: { type: [string, 'null'] }
        generatorModel: { type: [string, 'null'] }
        promptTemplateVersion: { type: [string, 'null'] }
        safetyState: { $ref: '#/components/schemas/MediaSafetyState' }
        altText: { type: object, additionalProperties: { type: string } }
        decorative: { type: boolean }
        createdAt: { type: string, format: date-time }
        reviewHistory:
          type: array
          items:
            type: object
            required: [action, actorSubject, createdAt]
            properties:
              action: { type: string }
              actorSubject: { type: string }
              reasonCode: { type: [string, 'null'] }
              note: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
    MediaView:
      type: object
      required: [entryId, state, alternatives, generationPending, hidden]
      properties:
        entryId: { type: string, format: uuid }
        senseId: { type: [string, 'null'], format: uuid }
        imageability: { anyOf: [{ $ref: '#/components/schemas/Imageability' }, { type: 'null' }] }
        state: { type: string, enum: [UNRESOLVED_PRIVATE, HIDDEN, APPROVED, GENERATING, FAILED, TEXT_ONLY, NO_IMAGE] }
        asset: { anyOf: [{ $ref: '#/components/schemas/MediaAsset' }, { type: 'null' }] }
        alternatives: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } }
        generationPending: { type: boolean }
        hidden: { type: boolean }
        failureCode: { type: [string, 'null'] }
    MediaOverride:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [DEFAULT, HIDE, APPROVED_ALTERNATIVE] }
        assetId: { type: [string, 'null'], format: uuid }
    MediaReview:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [APPROVE, REJECT] }
        reasonCode: { type: [string, 'null'], maxLength: 64 }
        note: { type: [string, 'null'], maxLength: 500 }
    KeyNgramSettings:
      type: object
      properties:
        minLength: { type: integer, minimum: 2, maximum: 8, default: 2 }
        maxLength: { type: integer, minimum: 2, maximum: 8, default: 5 }
        targetLimit: { type: integer, minimum: 1, maximum: 200, default: 64 }
        maxRepetitions: { type: integer, minimum: 1, maximum: 4, default: 2 }
    CompletionThresholds:
      type: object
      properties:
        distinctGradedPrompts: { type: integer, minimum: 1, maximum: 100, default: 8 }
        distinctEntries: { type: integer, minimum: 1, maximum: 30, default: 4 }
        masteryPercent: { type: integer, minimum: 1, maximum: 100, default: 80 }
        policyVersion: { type: string, maxLength: 64, default: vocabulary-homework-v1 }
    PracticeMode: { type: string, enum: [QUICK, BALANCED, WRITING, KEYBOARD] }
    PracticeStatus: { type: string, enum: [PREPARING, PUBLISHED, ACTIVE, PAUSED, COMPLETED, CANCELLED, FAILED] }
    SessionStatus: { type: string, enum: [NOT_STARTED, IN_PROGRESS, PAUSED, COMPLETED, CANCELLED] }
    ExerciseType: { type: string, enum: [FLASHCARD, MATCHING, MEANING_CHOICE, PHRASE_BUILDER, FORM_INPUT, CONTEXT_GAP, KEYBOARD] }
    SelectionReason: { type: string, enum: [OVERDUE, PINNED, DUE_TODAY, RECENT_LESSON, NEW, CONTROL_REVIEW, LAPSED, DIFFICULT, FAVORITE, LESSON, COURSE, EXPLICIT, FULL_DICTIONARY] }
    SelectionSource: { type: string, enum: [RECENT, DUE, FORGOTTEN, DIFFICULT, NEW, FAVORITE, LESSON, COURSE, FULL_DICTIONARY, EXPLICIT] }
    ReviewReason: { type: string, enum: [NEW, DUE, LAPSED, DIFFICULT, STABLE] }
    ReadinessWarning: { type: string, enum: [MISSING_TRANSLATION, MISSING_EXACT_EXAMPLE, INSUFFICIENT_DISTRACTORS] }
    SourceTerm:
      type: object
      required: [sourceText]
      properties:
        sourceText: { type: string, maxLength: 240 }
        sourceLanguage: { type: string, maxLength: 16 }
        targetLanguage: { type: string, maxLength: 16 }
        context: { type: string, maxLength: 1000 }
    TranslationSuggestionRequest:
      allOf:
        - { $ref: '#/components/schemas/SourceTerm' }
        - type: object
          properties:
            instruction: { type: string, maxLength: 500 }
            previousTranslations: { type: array, maxItems: 8, items: { type: string, maxLength: 500 } }
    TranslationVariant:
      type: object
      required: [translation]
      properties:
        translation: { type: string, maxLength: 500 }
        partOfSpeech: { type: [string, 'null'], maxLength: 80 }
        example: { type: [string, 'null'], maxLength: 1000 }
        exampleTranslation: { type: [string, 'null'], maxLength: 1000 }
    TranslationSuggestion:
      type: object
      required: [variants, source, translation]
      properties:
        variants: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/TranslationVariant' } }
        source: { type: string, enum: [OPENAI, UNAVAILABLE] }
        translation: { type: string, maxLength: 500 }
        partOfSpeech: { type: [string, 'null'], maxLength: 80 }
        example: { type: [string, 'null'], maxLength: 1000 }
        exampleTranslation: { type: [string, 'null'], maxLength: 1000 }
    CreateEntry:
      allOf:
        - { $ref: '#/components/schemas/SourceTerm' }
        - type: object
          required: [sourceType]
          properties:
            ownerSubject: { type: string, maxLength: 255 }
            translation: { type: string, maxLength: 500 }
            partOfSpeech: { type: string, maxLength: 80 }
            example: { type: string, maxLength: 1000 }
            exampleTranslation: { type: string, maxLength: 1000 }
            translationState: { $ref: '#/components/schemas/TranslationState' }
            sourceType: { $ref: '#/components/schemas/SourceType' }
            lessonId: { type: string, format: uuid }
            assignmentId: { type: string, format: uuid }
            materialId: { type: string, format: uuid }
            courseId: { type: string, format: uuid }
            blockId: { type: string, maxLength: 120 }
            sourceRevision: { type: string, maxLength: 128 }
