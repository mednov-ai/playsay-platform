      operationId: listHomeworkAssignments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentSummaryResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Assignments
      summary: Create homework assignment
      description: Creates a material-based homework assignment for selected students.
        Requires TEACHER or ADMIN role.
      operationId: createHomeworkAssignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeworkAssignmentRequest"
        required: true
      responses:
        "201":
          description: Homework assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAssignmentDetailResponse"
        "400":
          description: Invalid assignment payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot create assignments
