openapi: 3.1.0
info:
  title: Play&Say API Gateway
  description: Public contract for the Play&Say API Gateway.
  version: 0.1.0
servers:
- url: /api
  description: Play&Say web-app API proxy
paths:
  /users/me/profile:
    get:
      tags:
      - Users
      summary: Current application user profile
      description: Returns the app-level profile for the current Keycloak user.
      operationId: getMyUserProfile
      responses:
        "200":
          description: Current app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    put:
      tags:
      - Users
      summary: Update current application user profile
      description: Updates editable profile fields for the current Keycloak user.
      operationId: updateMyUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
        required: true
      responses:
        "200":
          description: Updated app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Invalid profile payload
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    delete:
      tags:
      - Users
      summary: Delete current application user profile
      description: Deletes editable app-level profile data for the current Keycloak
        user.
      operationId: deleteMyUserProfile
      responses:
        "204":
          description: Current app-level user profile deleted
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}:
    get:
      tags:
      - Schedule
      summary: Get scheduled lesson
      description: Returns a scheduled lesson visible to the current user.
      operationId: getScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Scheduled lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Schedule
      summary: Update scheduled lesson
      description: Updates a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: updateScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledLessonRequest"
        required: true
      responses:
        "200":
          description: Scheduled lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "400":
          description: Invalid scheduled lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Schedule
      summary: Delete scheduled lesson
      description: Deletes a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: deleteScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Scheduled lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material-submission:
    get:
      tags:
      - Materials
      summary: Get current material answer snapshot
      description: Returns the current user's saved answers for the material attached
        to a scheduled lesson.
      operationId: getScheduledLessonMaterialSubmission
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSubmissionResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: "Submission, lesson, or material not found"
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Save current material answer snapshot
      description: Creates or updates the current user's answers for the material
        attached to a scheduled lesson.
      operationId: saveScheduledLessonMaterialSubmission
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialSubmissionRequest"
        required: true
      responses:
        "200":
          description: Material submission saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSubmissionResponse"
        "400":
          description: Invalid submission payload
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material-annotation:
    get:
      tags:
      - Materials
      summary: Get shared material annotation layer
      description: Returns the shared drawing layer for the material attached to a
        scheduled lesson.
      operationId: getScheduledLessonMaterialAnnotation
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAnnotationResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: "Annotation, scheduled lesson, or material not found"
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Save shared material annotation layer
      description: Creates or updates the shared drawing layer for the material attached
        to a scheduled lesson.
      operationId: saveScheduledLessonMaterialAnnotation
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialAnnotationRequest"
        required: true
      responses:
        "200":
          description: Material annotation saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAnnotationResponse"
        "400":
          description: Invalid annotation payload
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /materials/{materialId}:
    get:
      tags:
      - Materials
      summary: Get lesson material
      description: Returns a visible lesson material.
      operationId: getMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Lesson material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Material not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Update lesson material
      description: Updates a structured lesson material. Requires material owner or
        ADMIN role.
      operationId: updateMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonMaterialRequest"
        required: true
      responses:
        "200":
          description: Lesson material updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "400":
          description: Invalid material payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot edit material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Materials
      summary: Archive lesson material
      description: Archives a lesson material. Requires material owner or ADMIN role.
      operationId: archiveMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Lesson material archived
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot archive material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
  /courses/{courseId}:
    get:
      tags:
      - Courses
      summary: Get course
      description: Returns a single course. Unpublished courses are visible only to
        teachers/admins.
      operationId: getCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Courses
      summary: Update course
      description: Updates a course. Requires TEACHER or ADMIN role.
      operationId: updateCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
        required: true
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          description: Invalid course payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course
      description: Deletes a course and its draft lesson templates. Requires TEACHER
        or ADMIN role.
      operationId: deleteCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
  /courses/{courseId}/lessons/{lessonId}:
    put:
      tags:
      - Courses
      summary: Update course lesson
      description: Updates a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: updateCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLessonRequest"
        required: true
      responses:
        "200":
          description: Course lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
        "400":
          description: Invalid course lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course lesson
      description: Deletes a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: deleteCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
  /schedule/lessons:
    get:
      tags:
      - Schedule
      summary: List scheduled lessons
      description: "Returns scheduled lessons. Teachers/admins see all, students see\
        \ lessons where they are participants."
      operationId: listScheduledLessons
      responses:
        "200":
          description: Scheduled lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledLessonResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    post:
      tags:
      - Schedule
      summary: Create scheduled lesson
      description: Creates a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: createScheduledLesson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledLessonRequest"
        required: true
      responses:
        "201":
          description: Scheduled lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "400":
          description: Invalid scheduled lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/room-token:
    post:
      tags:
      - Schedule
      summary: Create scheduled lesson video token
      description: Returns a short-lived LiveKit join token for a scheduled lesson
        visible to the current user.
      operationId: createScheduledLessonRoomToken
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: LiveKit room token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitRoomTokenResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson not found
        "503":
          description: LiveKit is not configured
      security:
      - bearerAuth: []
  /materials:
    get:
      tags:
      - Materials
      summary: List lesson materials
      description: Teachers/admins see their materials and published public materials.
        Students see published public materials.
      operationId: listMaterials
      responses:
        "200":
          description: Lesson materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    post:
      tags:
      - Materials
      summary: Create lesson material
      description: Creates a structured lesson material. Requires TEACHER or ADMIN
        role.
      operationId: createMaterial
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonMaterialRequest"
        required: true
      responses:
        "201":
          description: Lesson material created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "400":
          description: Invalid material payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage materials
      security:
      - bearerAuth: []
  /materials/{materialId}/generate-images:
    post:
      tags:
      - Materials
      summary: Generate material images
      description: "Generates missing or regenerated AI illustrations for generated-image\
        \ and matching-pairs material blocks, stores bytes in object storage, and\
        \ updates the material document. Requires material owner or ADMIN role."
      operationId: generateMaterialImages
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialGenerateImagesRequest"
        required: true
      responses:
        "200":
          description: Lesson material with generated images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot edit material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
  /materials/import-url:
    post:
      tags:
      - Materials
      summary: Draft lesson material from external URL
      description: "Fetches readable text from an http/https page, then returns a\
        \ structured Play&Say draft through the configured AI provider. Local/private\
        \ hosts are rejected."
      operationId: draftMaterialFromUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUrlImportRequest"
        required: true
      responses:
        "200":
          description: Draft material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialDraftResponse"
        "400":
          description: Invalid or unreadable external URL
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage materials
        "502":
          description: External URL or AI provider failed
      security:
      - bearerAuth: []
  /materials/ai-draft:
    post:
      tags:
      - Materials
      summary: Draft lesson material with AI
      description: "Returns a structured Play&Say material draft from a text prompt\
        \ and optional worksheet image scan/photo. Uses the configured AI provider,\
        \ or deterministic stub when AI is disabled."
      operationId: draftMaterialWithAi
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialAiDraftRequest"
        required: true
      responses:
        "200":
          description: Draft material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialDraftResponse"
        "400":
          description: Invalid draft prompt
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage materials
      security:
      - bearerAuth: []
  /courses:
    get:
      tags:
      - Courses
      summary: List courses
      description: Returns published courses for students and all courses for teachers/admins.
      operationId: listCourses
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    post:
      tags:
      - Courses
      summary: Create course
      description: Creates a course. Requires TEACHER or ADMIN role.
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
        required: true
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          description: Invalid course payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
      security:
      - bearerAuth: []
  /courses/{courseId}/lessons:
    get:
      tags:
      - Courses
      summary: List course lessons
      description: Returns lesson templates inside a course. Unpublished courses are
        visible only to teachers/admins.
      operationId: listCourseLessons
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Course lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseLessonResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    post:
      tags:
      - Courses
      summary: Create course lesson
      description: Creates a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: createCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLessonRequest"
        required: true
      responses:
        "201":
          description: Course lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
        "400":
          description: Invalid course lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
  /materials/{materialId}/assets/{assetId}:
    patch:
      tags:
      - Materials
      summary: Update material asset metadata
      description: "Updates editable metadata for a material asset, currently tags.\
        \ Requires material owner or ADMIN role."
      operationId: updateMaterialAsset
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialAssetUpdateRequest"
        required: true
      responses:
        "200":
          description: Updated material asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAssetResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot edit material
        "404":
          description: Material or asset not found
      security:
      - bearerAuth: []
  /users/students:
    get:
      tags:
      - Users
      summary: List student user profiles
      description: Returns known app-level student profiles. Requires TEACHER or ADMIN
        role.
      operationId: listStudentProfiles
      responses:
        "200":
          description: Known student user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user is not a teacher/admin
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material:
    get:
      tags:
      - Materials
      summary: Get scheduled lesson material
      description: Returns the material attached directly to a scheduled lesson or
        inherited from its lesson template.
      operationId: getScheduledLessonMaterial
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Scheduled lesson material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material-submissions:
    get:
      tags:
      - Materials
      summary: List material answer snapshots for scheduled lesson
      description: Returns saved student answers for the material attached to a scheduled
        lesson. Requires TEACHER or ADMIN role.
      operationId: listScheduledLessonMaterialSubmissions
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialSubmissionResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot monitor submissions
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /me:
    get:
      tags:
      - Auth
      summary: Current user profile
      description: Returns the current JWT profile and Play&Say application roles.
      operationId: getMe
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
  /materials/{materialId}/assets:
    get:
      tags:
      - Materials
      summary: List material assets
      operationId: listMaterialAssets
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialAssetResponse"
      security:
      - bearerAuth: []
  /materials/{materialId}/assets/{assetId}/content:
    get:
      tags:
      - Materials
      summary: Get material asset content
      description: Streams material asset bytes through the backend from the configured
        S3-compatible object storage.
      operationId: getMaterialAssetContent
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material asset content
          content:
            '*/*':
              schema:
                type: string
                format: byte
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Material asset not found
        "502":
          description: Object storage failed
      security:
      - bearerAuth: []
  /hello:
    get:
      tags:
      - Dev
      summary: Dev health message
      description: Returns a small public payload used by smoke tests.
      operationId: getHello
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
  /admin/users:
    get:
      tags:
      - Users
      summary: List application user profiles
      description: Returns known app-level user profiles. Requires the ADMIN role.
      operationId: listUserProfiles
      responses:
        "200":
          description: Known app-level user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user is not an admin
      security:
      - bearerAuth: []
