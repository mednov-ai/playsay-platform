server:
  port: 8080

spring:
  application:
    name: api-gateway
  datasource:
    url: ${PLAYSAY_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/playsay}
    username: ${PLAYSAY_DB_USERNAME:playsay_app}
    password: ${PLAYSAY_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_LIQUIBASE_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PLAYSAY_AUTH_ISSUER_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay}
          jwk-set-uri: ${PLAYSAY_AUTH_JWK_SET_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

playsay:
  ai:
    provider: ${PLAYSAY_AI_PROVIDER:stub}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  livekit:
    url: ${PLAYSAY_LIVEKIT_URL:wss://online.play-and-say.ru/livekit}
    api-key: ${PLAYSAY_LIVEKIT_API_KEY:}
    api-secret: ${PLAYSAY_LIVEKIT_API_SECRET:}
    token-ttl-seconds: ${PLAYSAY_LIVEKIT_TOKEN_TTL_SECONDS:3600}
