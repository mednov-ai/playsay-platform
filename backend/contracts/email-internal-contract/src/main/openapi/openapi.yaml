openapi: 3.0.3
info:
  title: Honey School Email Service Boundary API
  version: 0.1.0
  description: >-
    Service-owned contract for transactional delivery, delivery administration,
    resend, and provider webhook forwarding. Provider webhook requests remain
    opaque raw JSON and must not be parsed and reserialized by the gateway.
security:
  - emailServiceToken: []
paths:
  /internal/emails/transactional:
    post:
      operationId: sendTransactionalEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionalEmailRequest"
      responses:
        "202":
          description: Transactional delivery accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionalEmailResponse"
        "400":
          description: Invalid transactional email payload.
        "401":
          description: Missing or invalid email service token.
  /internal/admin/email-deliveries:
    get:
      operationId: listEmailDeliveries
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, format: int32, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, format: int32, default: 25 }
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: providerStatus
          in: query
          required: false
          schema: { type: string }
        - name: templateKey
          in: query
          required: false
          schema: { type: string }
        - name: createdFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Filtered delivery page returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDeliveryPageResponse"
        "401":
          description: Missing or invalid email service token.
  /internal/admin/email-deliveries/{id}:
    get:
      operationId: getEmailDelivery
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Delivery and provider attempts returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDeliveryDetailResponse"
        "401":
          description: Missing or invalid email service token.
        "404":
          description: Delivery not found.
  /internal/admin/email-deliveries/{id}/resend:
    post:
      operationId: resendEmailDelivery
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Resend result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDeliveryResendResponse"
        "401":
          description: Missing or invalid email service token.
        "404":
          description: Delivery not found.
        "409":
          description: Delivery cannot be resent in its current state.
  /internal/email-provider/mailjet/webhook:
    post:
      operationId: processMailjetWebhook
      description: Original UTF-8 JSON body is forwarded without normalization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Provider event accepted; no response body.
        "401":
          description: Missing or invalid email service token.
  /internal/email-provider/unisender/webhook:
    post:
      operationId: processUnisenderWebhook
      description: Original UTF-8 JSON body is forwarded without normalization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Provider event accepted; no response body.
        "401":
          description: Missing/invalid service token or rejected provider signature.
components:
  securitySchemes:
    emailServiceToken:
      type: apiKey
      in: header
      name: X-PlaySay-Email-Service-Token
  parameters:
    DeliveryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    TransactionalEmailRequest:
      type: object
      required: [to, templateKey, idempotencyKey]
      properties:
        to:
          type: string
          format: email
          minLength: 1
          maxLength: 320
          x-field-extra-annotation:
            - "@field:jakarta.validation.constraints.Email"
            - "@field:jakarta.validation.constraints.NotBlank"
            - "@field:jakarta.validation.constraints.Size(max = 320)"
        templateKey:
          type: string
          minLength: 1
          maxLength: 120
          x-field-extra-annotation:
            - "@field:jakarta.validation.constraints.NotBlank"
            - "@field:jakarta.validation.constraints.Size(max = 120)"
        locale:
          type: string
          nullable: true
          maxLength: 16
          x-field-extra-annotation: "@field:jakarta.validation.constraints.Size(max = 16)"
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
          x-field-extra-annotation:
            - "@field:jakarta.validation.constraints.NotBlank"
            - "@field:jakarta.validation.constraints.Size(max = 255)"
        model:
          type: object
          default: {}
          additionalProperties:
            type: string
            nullable: true
        replayUntil:
          type: string
          format: date-time
          nullable: true
    TransactionalEmailResponse:
      type: object
      required: [status, deliveryAttemptId, provider, providerStatus]
      properties:
        status: { type: string }
        deliveryAttemptId: { type: string, format: uuid }
        provider: { type: string, nullable: true }
        providerStatus: { type: string, nullable: true }
    EmailDeliveryPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailDeliverySummaryResponse"
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }
    EmailDeliverySummaryResponse:
      type: object
      required:
        - id
        - toEmail
        - templateKey
        - locale
        - subject
        - status
        - provider
        - providerStatus
        - providerDeliveryStatus
        - providerDestinationResponse
        - providerAttemptCount
        - providerEventAt
        - providerCheckedAt
        - providerTrackingUntil
        - resendAllowed
        - resendReason
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        toEmail: { type: string }
        templateKey: { type: string }
        locale: { type: string }
        subject: { type: string, nullable: true }
        status: { type: string }
        provider: { type: string, nullable: true }
        providerStatus: { type: string, nullable: true }
        providerDeliveryStatus: { type: string, nullable: true }
        providerDestinationResponse: { type: string, nullable: true }
        providerAttemptCount: { type: integer, format: int32 }
        providerEventAt: { type: string, format: date-time, nullable: true }
        providerCheckedAt: { type: string, format: date-time, nullable: true }
        providerTrackingUntil: { type: string, format: date-time, nullable: true }
        resendAllowed: { type: boolean }
        resendReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmailDeliveryDetailResponse:
      type: object
      required: [delivery, attempts]
      properties:
        delivery:
          $ref: "#/components/schemas/EmailDeliverySummaryResponse"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/EmailProviderAttemptResponse"
    EmailProviderAttemptResponse:
      type: object
      required:
        - id
        - attemptNumber
        - provider
        - providerJobId
        - providerStatus
        - providerDeliveryStatus
        - providerDestinationResponse
        - providerEventAt
        - providerCheckedAt
        - trackingUntil
        - errorMessage
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        attemptNumber: { type: integer, format: int32 }
        provider: { type: string }
        providerJobId: { type: string, nullable: true }
        providerStatus: { type: string }
        providerDeliveryStatus: { type: string, nullable: true }
        providerDestinationResponse: { type: string, nullable: true }
        providerEventAt: { type: string, format: date-time, nullable: true }
        providerCheckedAt: { type: string, format: date-time, nullable: true }
        trackingUntil: { type: string, format: date-time, nullable: true }
        errorMessage: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmailDeliveryResendResponse:
      type: object
      required: [deliveryAttemptId, status, provider, providerStatus]
      properties:
        deliveryAttemptId: { type: string, format: uuid }
        status: { type: string }
        provider: { type: string, nullable: true }
        providerStatus: { type: string, nullable: true }
