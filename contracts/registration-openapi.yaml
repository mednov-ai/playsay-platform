openapi: 3.0.3
info:
  title: Honey School Registration API
  version: 0.1.0
paths:
  /registration/start:
    post:
      operationId: startRegistration
      summary: Start email registration
      description: Creates or refreshes a pending email registration and sends a confirmation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRegistrationRequest"
      responses:
        "202":
          description: Generic check-email response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid registration payload.
        "429":
          description: Registration rate limit exceeded.
  /registration/resend:
    post:
      operationId: resendRegistration
      summary: Resend confirmation email
      description: Resends a registration confirmation email when a pending registration exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendRegistrationRequest"
      responses:
        "202":
          description: Generic check-email response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid resend payload.
        "429":
          description: Registration rate limit exceeded.
  /registration/confirm:
    post:
      operationId: confirmRegistration
      summary: Confirm email registration
      description: Confirms a pending registration token and activates the Keycloak student account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRegistrationRequest"
      responses:
        "200":
          description: Confirmed registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid or expired confirmation token.
  /registration/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset code
      description: Sends a generic response and, when an active account exists, sends a one-time password reset code by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Generic check-email response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid password reset request payload.
        "429":
          description: Password reset rate limit exceeded.
  /registration/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password with email code
      description: Verifies a one-time code and updates the Keycloak user password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid code, expired code, or weak password.
  /api/internal/lesson-auth/identities/resolve:
    post:
      operationId: resolveLessonIdentity
      summary: Resolve one exact verified account identity for lesson admission
      security: [{ internalServiceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonIdentityResolveRequest" }
      responses:
        "200":
          description: Exact enabled identity or an empty response when none exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonIdentityResolveResponse" }
  /api/internal/lesson-auth/assertions:
    post:
      operationId: createLessonAuthAssertion
      summary: Create a one-time subject-bound lesson authentication assertion
      security: [{ internalServiceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonAuthAssertionCreateRequest" }
      responses:
        "201":
          description: Opaque assertion created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonAuthAssertionCreateResponse" }
  /api/provider/lesson-auth/assertions/redeem:
    post:
      operationId: redeemLessonAuthAssertion
      summary: Atomically redeem a lesson assertion from the pinned Keycloak provider
      security: [{ lessonProviderToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonAuthAssertionRedeemRequest" }
      responses:
        "200":
          description: Exact enabled realm subject and remember choice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonAuthAssertionRedeemResponse" }
        "400": { description: "Assertion is invalid, expired, replayed, or bound to another environment/client/callback." }
  /api/internal/lesson-auth/users/{subject}/sessions/{sessionId}:
    delete:
      operationId: revokeLessonSession
      summary: Revoke one owner-selected remembered browser session
      security: [{ internalServiceToken: [] }]
      parameters:
        - { in: path, name: subject, required: true, schema: { type: string } }
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        "204": { description: Session revoked. }
  /api/internal/lesson-auth/users/{subject}/sessions:
    delete:
      operationId: revokeAllLessonSessions
      summary: Revoke all remembered sessions for the exact owner subject
      security: [{ internalServiceToken: [] }]
      parameters:
        - { in: path, name: subject, required: true, schema: { type: string } }
      responses:
        "204": { description: Sessions revoked. }
  /student-invites/consume:
    post:
      operationId: consumeStudentInvite
      deprecated: true
      summary: Reject a legacy managed-student lesson invite
      description: Legacy compatibility endpoint. It never resolves the invite, mutates credentials, or issues tokens; clients must request the reusable shared lesson link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInviteConsumeRequest"
      responses:
        "410":
          description: Legacy link replaced by the reusable shared lesson-link flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid, expired, or already consumed invite code.
components:
  securitySchemes:
    internalServiceToken:
      type: apiKey
      in: header
      name: X-PlaySay-Service-Token
    lessonProviderToken:
      type: apiKey
      in: header
      name: X-PlaySay-Lesson-Provider-Token
  schemas:
    LessonIdentityResolveRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    LessonIdentityResolveResponse:
      type: object
      required: [subject, email, roles]
      properties:
        subject: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        roles: { type: array, uniqueItems: true, items: { type: string } }
    LessonAuthAssertionCreateRequest:
      type: object
      required: [subject, browserAttemptId, clientId, issuer, callback, rememberMe]
      properties:
        subject: { type: string, maxLength: 255 }
        browserAttemptId: { type: string, format: uuid }
        clientId: { type: string, maxLength: 128 }
        issuer: { type: string, format: uri, maxLength: 512 }
        callback: { type: string, format: uri, maxLength: 1024 }
        rememberMe: { type: boolean, default: false }
    LessonAuthAssertionCreateResponse:
      type: object
      required: [handle, expiresAt]
      properties:
        handle: { type: string }
        expiresAt: { type: string, format: date-time }
    LessonAuthAssertionRedeemRequest:
      type: object
      required: [handle, clientId, issuer, callback]
      properties:
        handle: { type: string, maxLength: 255 }
        clientId: { type: string, maxLength: 128 }
        issuer: { type: string, format: uri, maxLength: 512 }
        callback: { type: string, format: uri, maxLength: 1024 }
    LessonAuthAssertionRedeemResponse:
      type: object
      required: [subject, rememberMe]
      properties:
        subject: { type: string }
        rememberMe: { type: boolean }
    StartRegistrationRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          nullable: true
          maxLength: 120
        locale:
          type: string
          nullable: true
          maxLength: 16
        returnTo:
          type: string
          nullable: true
          maxLength: 1024
    ResendRegistrationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        locale:
          type: string
          nullable: true
          maxLength: 16
        returnTo:
          type: string
          nullable: true
          maxLength: 1024
    ConfirmRegistrationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 255
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        locale:
          type: string
          nullable: true
          maxLength: 16
        returnTo:
          type: string
          nullable: true
          maxLength: 1024
    ResetPasswordRequest:
      type: object
      required:
        - email
        - code
        - newPassword
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          minLength: 6
          maxLength: 12
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    RegistrationResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        continueUrl:
          type: string
          nullable: true
    StudentInviteConsumeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: One-time managed-student invite code. New codes are at most 6 characters; longer legacy pending tokens remain accepted for compatibility.
          minLength: 1
          maxLength: 255
