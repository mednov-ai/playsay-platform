server:
  port: 8086

spring:
  application:
    name: email-service
  datasource:
    url: ${PLAYSAY_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/playsay}
    username: ${PLAYSAY_DB_USERNAME:playsay_app}
    password: ${PLAYSAY_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_EMAIL_LIQUIBASE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mail:
    host: ${PLAYSAY_EMAIL_SMTP_HOST:localhost}
    port: ${PLAYSAY_EMAIL_SMTP_PORT:587}
    username: ${PLAYSAY_EMAIL_SMTP_USERNAME:}
    password: ${PLAYSAY_EMAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${PLAYSAY_EMAIL_SMTP_AUTH:true}
          starttls:
            enable: ${PLAYSAY_EMAIL_SMTP_STARTTLS:true}

management:
  health:
    mail:
      enabled: ${PLAYSAY_EMAIL_SMTP_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.orm.connections.pooling: warn

playsay:
  email-service:
    delivery-provider: ${PLAYSAY_EMAIL_DELIVERY_PROVIDER:smtp}
    service-token: ${PLAYSAY_EMAIL_SERVICE_TOKEN:}
    from-address: ${PLAYSAY_EMAIL_FROM_ADDRESS:no-reply@honey.school}
    from-name: ${PLAYSAY_EMAIL_FROM_NAME:Honey School}
    replay-encryption-key: ${PLAYSAY_EMAIL_REPLAY_ENCRYPTION_KEY:}
    default-replay-ttl: ${PLAYSAY_EMAIL_DEFAULT_REPLAY_TTL:PT72H}
    provider-tracking-ttl: ${PLAYSAY_EMAIL_PROVIDER_TRACKING_TTL:PT72H}
    provider-reconcile-window: ${PLAYSAY_EMAIL_PROVIDER_RECONCILE_WINDOW:PT5M}
    provider-reconcile-overlap: ${PLAYSAY_EMAIL_PROVIDER_RECONCILE_OVERLAP:PT1M}
    provider-reconcile-poll-ms: ${PLAYSAY_EMAIL_PROVIDER_RECONCILE_POLL_MS:30000}
    provider-reconcile-initial-delay-ms: ${PLAYSAY_EMAIL_PROVIDER_RECONCILE_INITIAL_DELAY_MS:30000}
    webhook-check-ms: ${PLAYSAY_EMAIL_WEBHOOK_CHECK_MS:3600000}
    webhook-check-initial-delay-ms: ${PLAYSAY_EMAIL_WEBHOOK_CHECK_INITIAL_DELAY_MS:45000}
    unisender:
      api-base-url: ${PLAYSAY_EMAIL_UNISENDER_API_BASE_URL:https://goapi.unisender.ru/ru/transactional/api/v1}
      user-id: ${PLAYSAY_EMAIL_UNISENDER_USER_ID:0}
      api-key: ${PLAYSAY_EMAIL_UNISENDER_API_KEY:}
      webhook-url: ${PLAYSAY_EMAIL_UNISENDER_WEBHOOK_URL:}
    mailjet:
      api-base-url: ${PLAYSAY_EMAIL_MAILJET_API_BASE_URL:https://api.mailjet.com}
      api-key: ${PLAYSAY_EMAIL_MAILJET_API_KEY:}
      secret-key: ${PLAYSAY_EMAIL_MAILJET_SECRET_KEY:}
      environment: ${PLAYSAY_EMAIL_MAILJET_ENVIRONMENT:local}
      webhook-url: ${PLAYSAY_EMAIL_MAILJET_WEBHOOK_URL:}
      webhook-username: ${PLAYSAY_EMAIL_MAILJET_WEBHOOK_USERNAME:}
      webhook-password: ${PLAYSAY_EMAIL_MAILJET_WEBHOOK_PASSWORD:}
