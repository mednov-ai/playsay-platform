server:
  port: 8080
  tomcat:
    max-part-count: ${PLAYSAY_WORKSHEET_GATEWAY_MULTIPART_MAX_PART_COUNT:101}

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: ${PLAYSAY_WORKSHEET_GATEWAY_MULTIPART_MAX_FILE_SIZE:64MB}
      max-request-size: ${PLAYSAY_WORKSHEET_GATEWAY_MULTIPART_MAX_REQUEST_SIZE:128MB}
      file-size-threshold: ${PLAYSAY_WORKSHEET_GATEWAY_MULTIPART_FILE_SIZE_THRESHOLD:1MB}
  messages:
    fallback-to-system-locale: false
  datasource:
    url: ${PLAYSAY_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/playsay}
    username: ${PLAYSAY_DB_USERNAME:playsay_app}
    password: ${PLAYSAY_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_LIQUIBASE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PLAYSAY_AUTH_ISSUER_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay}
          jwk-set-uri: ${PLAYSAY_AUTH_JWK_SET_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.orm.connections.pooling: warn

playsay:
  worksheet-import:
    enabled: ${PLAYSAY_WORKSHEET_IMPORT_ENABLED:false}
    base-url: ${PLAYSAY_WORKSHEET_SERVICE_BASE_URL:http://worksheet-import-service.playsay-dev.svc.cluster.local}
    service-token: ${PLAYSAY_WORKSHEET_SERVICE_TOKEN:}
    connect-timeout: ${PLAYSAY_WORKSHEET_GATEWAY_CONNECT_TIMEOUT:PT5S}
    request-timeout: ${PLAYSAY_WORKSHEET_GATEWAY_REQUEST_TIMEOUT:PT2M}
    max-file-bytes: ${PLAYSAY_WORKSHEET_GATEWAY_MAX_FILE_BYTES:67108864}
    max-request-bytes: ${PLAYSAY_WORKSHEET_GATEWAY_MAX_REQUEST_BYTES:134217728}
  websocket:
    allowed-origin-patterns: "${PLAYSAY_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}"
  ai:
    provider: ${PLAYSAY_AI_PROVIDER:stub}
    html-game-enrichment:
      enabled: ${PLAYSAY_HTML_GAME_ENRICHMENT_ENABLED:true}
      poll-delay-ms: ${PLAYSAY_HTML_GAME_ENRICHMENT_POLL_DELAY_MS:3000}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      reasoning:
        material-draft: ${OPENAI_MATERIAL_DRAFT_REASONING_EFFORT:medium}
        answer-suggestion: ${OPENAI_ANSWER_SUGGESTION_REASONING_EFFORT:medium}
        html-game-metadata: ${OPENAI_HTML_GAME_REASONING_EFFORT:medium}
  livekit:
    url: ${PLAYSAY_LIVEKIT_URL:wss://online.honey.school/livekit}
    api-key: ${PLAYSAY_LIVEKIT_API_KEY:}
    api-secret: ${PLAYSAY_LIVEKIT_API_SECRET:}
    token-ttl-seconds: ${PLAYSAY_LIVEKIT_TOKEN_TTL_SECONDS:3600}
  lesson-translation:
    enabled: ${PLAYSAY_LESSON_TRANSLATION_ENABLED:false}
    provider: ${PLAYSAY_LESSON_TRANSLATION_PROVIDER:stub}
    api-key: ${PLAYSAY_LESSON_TRANSLATION_API_KEY:${OPENAI_API_KEY:}}
    model: ${PLAYSAY_LESSON_TRANSLATION_MODEL:gpt-realtime-translate}
    base-url: ${PLAYSAY_LESSON_TRANSLATION_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
  collaboration:
    websocket-url: ${PLAYSAY_COLLABORATION_WEBSOCKET_URL:wss://online.honey.school/collab/ws}
    token-secret: ${PLAYSAY_COLLABORATION_TOKEN_SECRET:}
    service-token: ${PLAYSAY_COLLABORATION_SERVICE_TOKEN:}
    token-ttl-seconds: ${PLAYSAY_COLLABORATION_TOKEN_TTL_SECONDS:900}
  media-service:
    base-url: ${PLAYSAY_MEDIA_SERVICE_BASE_URL:http://media-service.playsay-dev.svc.cluster.local}
    service-token: ${PLAYSAY_MEDIA_SERVICE_TOKEN:}
    cache-request-timeout-seconds: ${PLAYSAY_MEDIA_SERVICE_CACHE_REQUEST_TIMEOUT_SECONDS:660}
  game-adapter-service:
    base-url: ${PLAYSAY_GAME_ADAPTER_SERVICE_BASE_URL:http://game-adapter-service.playsay-dev.svc.cluster.local}
    service-token: ${PLAYSAY_GAME_ADAPTER_SERVICE_TOKEN:}
    enabled: ${PLAYSAY_GAME_ADAPTER_ENABLED:true}
    poll-delay-ms: ${PLAYSAY_GAME_ADAPTER_POLL_DELAY_MS:3000}
  payment-service:
    base-url: ${PLAYSAY_PAYMENT_SERVICE_BASE_URL:http://payment-service.playsay-dev.svc.cluster.local}
    service-token: ${PLAYSAY_PAYMENT_SERVICE_TOKEN:}
  registration-service:
    base-url: ${PLAYSAY_REGISTRATION_SERVICE_BASE_URL:http://registration-service.playsay-dev.svc.cluster.local}
    service-token: ${PLAYSAY_REGISTRATION_SERVICE_TOKEN:}
  user-data:
    service-token: ${PLAYSAY_USER_DATA_SERVICE_TOKEN:}
    ai-tutor-base-url: ${PLAYSAY_AI_TUTOR_SERVICE_BASE_URL:http://ai-tutor-service.playsay-dev.svc.cluster.local}
    vocabulary-base-url: ${PLAYSAY_VOCABULARY_SERVICE_BASE_URL:http://vocabulary-service.playsay-dev.svc.cluster.local}
    keyboard-base-url: ${PLAYSAY_KEYBOARD_SERVICE_BASE_URL:http://keyboard-service.playsay-dev.svc.cluster.local}
  vocabulary-assignments:
    retry-delay-ms: ${PLAYSAY_VOCABULARY_ASSIGNMENT_RETRY_DELAY_MS:10000}
  email-service:
    base-url: ${PLAYSAY_EMAIL_SERVICE_BASE_URL:http://email-service.playsay-dev.svc.cluster.local}
    service-token: ${PLAYSAY_EMAIL_SERVICE_TOKEN:}
    mailjet:
      webhook-username: ${PLAYSAY_EMAIL_MAILJET_WEBHOOK_USERNAME:}
      webhook-password: ${PLAYSAY_EMAIL_MAILJET_WEBHOOK_PASSWORD:}
  public-app-url: ${PLAYSAY_PUBLIC_APP_URL:https://online.honey.school}
  lesson-reminders:
    poll-delay-ms: ${PLAYSAY_LESSON_REMINDERS_POLL_DELAY_MS:60000}
  chat-email:
    initial-delay: ${PLAYSAY_CHAT_EMAIL_INITIAL_DELAY:PT2M}
    cooldown: ${PLAYSAY_CHAT_EMAIL_COOLDOWN:PT10M}
    poll-delay-ms: ${PLAYSAY_CHAT_EMAIL_POLL_DELAY_MS:30000}
    retry-delays: ${PLAYSAY_CHAT_EMAIL_RETRY_DELAYS:PT1M,PT5M,PT15M}
  storage:
    provider: ${PLAYSAY_STORAGE_PROVIDER:memory}
    s3:
      endpoint: ${PLAYSAY_S3_ENDPOINT:}
      region: ${PLAYSAY_S3_REGION:us-east-1}
      bucket: ${PLAYSAY_S3_BUCKET:playsay-material-assets}
      access-key: ${PLAYSAY_S3_ACCESS_KEY:}
      secret-key: ${PLAYSAY_S3_SECRET_KEY:}
      path-style-access: ${PLAYSAY_S3_PATH_STYLE_ACCESS:true}
      create-bucket: ${PLAYSAY_S3_CREATE_BUCKET:false}
  video:
    youtube:
      rf-relay:
        enabled: ${PLAYSAY_YOUTUBE_RF_RELAY_ENABLED:false}
        geo-country-header: ${PLAYSAY_YOUTUBE_RF_RELAY_GEO_COUNTRY_HEADER:}
        require-geo-country: ${PLAYSAY_YOUTUBE_RF_RELAY_REQUIRE_GEO_COUNTRY:true}
      cache:
        enabled: ${PLAYSAY_YOUTUBE_CACHE_ENABLED:false}
        poll-delay-ms: ${PLAYSAY_YOUTUBE_CACHE_POLL_DELAY_MS:5000}
        initial-delay-ms: ${PLAYSAY_YOUTUBE_CACHE_INITIAL_DELAY_MS:5000}
        lease-seconds: ${PLAYSAY_YOUTUBE_CACHE_LEASE_SECONDS:900}
        retention-days: ${PLAYSAY_YOUTUBE_CACHE_RETENTION_DAYS:30}
        cleanup-delay-ms: ${PLAYSAY_YOUTUBE_CACHE_CLEANUP_DELAY_MS:86400000}
        cleanup-initial-delay-ms: ${PLAYSAY_YOUTUBE_CACHE_CLEANUP_INITIAL_DELAY_MS:60000}
