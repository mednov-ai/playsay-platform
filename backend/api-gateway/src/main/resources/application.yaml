server:
  port: 8080

spring:
  application:
    name: api-gateway
  messages:
    fallback-to-system-locale: false
  datasource:
    url: ${PLAYSAY_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/playsay}
    username: ${PLAYSAY_DB_USERNAME:playsay_app}
    password: ${PLAYSAY_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_LIQUIBASE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PLAYSAY_AUTH_ISSUER_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay}
          jwk-set-uri: ${PLAYSAY_AUTH_JWK_SET_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

playsay:
  ai:
    provider: ${PLAYSAY_AI_PROVIDER:stub}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4-mini}
      image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  livekit:
    url: ${PLAYSAY_LIVEKIT_URL:wss://online.play-and-say.ru/livekit}
    api-key: ${PLAYSAY_LIVEKIT_API_KEY:}
    api-secret: ${PLAYSAY_LIVEKIT_API_SECRET:}
    token-ttl-seconds: ${PLAYSAY_LIVEKIT_TOKEN_TTL_SECONDS:3600}
  collaboration:
    websocket-url: ${PLAYSAY_COLLABORATION_WEBSOCKET_URL:wss://online.play-and-say.ru/collab/ws}
    token-secret: ${PLAYSAY_COLLABORATION_TOKEN_SECRET:}
    service-token: ${PLAYSAY_COLLABORATION_SERVICE_TOKEN:}
    token-ttl-seconds: ${PLAYSAY_COLLABORATION_TOKEN_TTL_SECONDS:900}
  media-service:
    base-url: ${PLAYSAY_MEDIA_SERVICE_BASE_URL:http://media-service.playsay-dev.svc.cluster.local}
    service-token: ${PLAYSAY_MEDIA_SERVICE_TOKEN:}
  storage:
    provider: ${PLAYSAY_STORAGE_PROVIDER:memory}
    s3:
      endpoint: ${PLAYSAY_S3_ENDPOINT:}
      region: ${PLAYSAY_S3_REGION:us-east-1}
      bucket: ${PLAYSAY_S3_BUCKET:playsay-material-assets}
      access-key: ${PLAYSAY_S3_ACCESS_KEY:}
      secret-key: ${PLAYSAY_S3_SECRET_KEY:}
      path-style-access: ${PLAYSAY_S3_PATH_STYLE_ACCESS:true}
      create-bucket: ${PLAYSAY_S3_CREATE_BUCKET:false}
  video:
    youtube:
      rf-relay:
        enabled: ${PLAYSAY_YOUTUBE_RF_RELAY_ENABLED:false}
        geo-country-header: ${PLAYSAY_YOUTUBE_RF_RELAY_GEO_COUNTRY_HEADER:}
        require-geo-country: ${PLAYSAY_YOUTUBE_RF_RELAY_REQUIRE_GEO_COUNTRY:true}
