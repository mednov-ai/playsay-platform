openapi: 3.1.0
info:
  title: Play&Say API Gateway
  description: Public contract for the Play&Say API Gateway.
  version: 0.1.0
servers:
- url: /api
  description: Play&Say web-app API proxy
paths:
  /users/me/profile:
    get:
      tags:
      - Users
      summary: Current application user profile
      description: Returns the app-level profile for the current Keycloak user.
      operationId: getMyUserProfile
      responses:
        "200":
          description: Current app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    put:
      tags:
      - Users
      summary: Update current application user profile
      description: Updates editable profile fields for the current Keycloak user.
      operationId: updateMyUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
        required: true
      responses:
        "200":
          description: Updated app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Invalid profile payload
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    delete:
      tags:
      - Users
      summary: Delete current application user profile
      description: Deletes editable app-level profile data for the current Keycloak
        user.
      operationId: deleteMyUserProfile
      responses:
        "204":
          description: Current app-level user profile deleted
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}:
    get:
      tags:
      - Schedule
      summary: Get scheduled lesson
      description: Returns a scheduled lesson visible to the current user.
      operationId: getScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Scheduled lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Schedule
      summary: Update scheduled lesson
      description: Updates a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: updateScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledLessonRequest"
        required: true
      responses:
        "200":
          description: Scheduled lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "400":
          description: Invalid scheduled lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Schedule
      summary: Delete scheduled lesson
      description: Deletes a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: deleteScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Scheduled lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
  /courses/{courseId}:
    get:
      tags:
      - Courses
      summary: Get course
      description: Returns a single course. Unpublished courses are visible only to
        teachers/admins.
      operationId: getCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Courses
      summary: Update course
      description: Updates a course. Requires TEACHER or ADMIN role.
      operationId: updateCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
        required: true
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          description: Invalid course payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course
      description: Deletes a course and its draft lesson templates. Requires TEACHER
        or ADMIN role.
      operationId: deleteCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
  /courses/{courseId}/lessons/{lessonId}:
    put:
      tags:
      - Courses
      summary: Update course lesson
      description: Updates a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: updateCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLessonRequest"
        required: true
      responses:
        "200":
          description: Course lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
        "400":
          description: Invalid course lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course lesson
      description: Deletes a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: deleteCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
  /schedule/lessons:
    get:
      tags:
      - Schedule
      summary: List scheduled lessons
      description: "Returns scheduled lessons. Teachers/admins see all, students see\
        \ lessons where they are participants."
      operationId: listScheduledLessons
      responses:
        "200":
          description: Scheduled lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledLessonResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    post:
      tags:
      - Schedule
      summary: Create scheduled lesson
      description: Creates a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: createScheduledLesson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledLessonRequest"
        required: true
      responses:
        "201":
          description: Scheduled lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "400":
          description: Invalid scheduled lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
      security:
      - bearerAuth: []
  /courses:
    get:
      tags:
      - Courses
      summary: List courses
      description: Returns published courses for students and all courses for teachers/admins.
      operationId: listCourses
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    post:
      tags:
      - Courses
      summary: Create course
      description: Creates a course. Requires TEACHER or ADMIN role.
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
        required: true
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          description: Invalid course payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
      security:
      - bearerAuth: []
  /courses/{courseId}/lessons:
    get:
      tags:
      - Courses
      summary: List course lessons
      description: Returns lesson templates inside a course. Unpublished courses are
        visible only to teachers/admins.
      operationId: listCourseLessons
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Course lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseLessonResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    post:
      tags:
      - Courses
      summary: Create course lesson
      description: Creates a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: createCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLessonRequest"
        required: true
      responses:
        "201":
          description: Course lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
        "400":
          description: Invalid course lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
  /users/students:
    get:
      tags:
      - Users
      summary: List student user profiles
      description: Returns known app-level student profiles. Requires TEACHER or ADMIN
        role.
      operationId: listStudentProfiles
      responses:
        "200":
          description: Known student user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user is not a teacher/admin
      security:
      - bearerAuth: []
  /me:
    get:
      tags:
      - Auth
      summary: Current user profile
      description: Returns the current JWT profile and Play&Say application roles.
      operationId: getMe
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
  /hello:
    get:
      tags:
      - Dev
      summary: Dev health message
      description: Returns a small public payload used by smoke tests.
      operationId: getHello
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
  /admin/users:
    get:
      tags:
      - Users
      summary: List application user profiles
      description: Returns known app-level user profiles. Requires the ADMIN role.
      operationId: listUserProfiles
      responses:
        "200":
          description: Known app-level user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user is not an admin
      security:
      - bearerAuth: []
components:
  schemas:
    UpdateUserProfileRequest:
      type: object
      properties:
        displayName:
          type:
          - string
          - "null"
          maxLength: 120
        locale:
          type:
          - string
          - "null"
          maxLength: 16
        timezone:
          type:
          - string
          - "null"
          maxLength: 64
        learningGoal:
          type:
          - string
          - "null"
          maxLength: 500
    UserProfileResponse:
      type: object
      properties:
        subject:
          type: string
        username:
          type:
          - string
          - "null"
        email:
          type:
          - string
          - "null"
        name:
          type:
          - string
          - "null"
        roles:
          type: array
          items:
            type: string
        displayName:
          type:
          - string
          - "null"
        locale:
          type:
          - string
          - "null"
        timezone:
          type:
          - string
          - "null"
        learningGoal:
          type:
          - string
          - "null"
        updatedAt:
          type: string
          format: date-time
      required:
      - roles
      - subject
      - updatedAt
    ScheduledLessonRequest:
      type: object
      properties:
        lessonTemplateId:
          type:
          - string
          - "null"
          format: uuid
        scheduledStart:
          type:
          - string
          - "null"
          format: date-time
        scheduledEnd:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
          enum:
          - SCHEDULED
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        type:
          type: string
          enum:
          - INDIVIDUAL
          - GROUP
        participantSubjects:
          type: array
          items:
            type: string
      required:
      - participantSubjects
      - status
      - type
    ScheduledLessonParticipantResponse:
      type: object
      properties:
        subject:
          type: string
        username:
          type:
          - string
          - "null"
        displayName:
          type:
          - string
          - "null"
        attendanceStatus:
          type:
          - string
          - "null"
      required:
      - subject
    ScheduledLessonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lessonTemplateId:
          type:
          - string
          - "null"
          format: uuid
        courseId:
          type:
          - string
          - "null"
          format: uuid
        courseTitle:
          type:
          - string
          - "null"
        lessonTitle:
          type:
          - string
          - "null"
        teacherSubject:
          type:
          - string
          - "null"
        teacherName:
          type:
          - string
          - "null"
        scheduledStart:
          type:
          - string
          - "null"
          format: date-time
        scheduledEnd:
          type:
          - string
          - "null"
          format: date-time
        status:
          type: string
        type:
          type: string
        livekitRoomName:
          type:
          - string
          - "null"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledLessonParticipantResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - participants
      - status
      - type
      - updatedAt
    CourseRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type:
          - string
          - "null"
          maxLength: 2000
        level:
          type:
          - string
          - "null"
          maxLength: 16
        language:
          type: string
          maxLength: 16
        isPublished:
          type: boolean
      required:
      - isPublished
      - language
      - title
    CourseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type:
          - string
          - "null"
        level:
          type:
          - string
          - "null"
        language:
          type: string
        createdByUserId:
          type:
          - string
          - "null"
          format: uuid
        isPublished:
          type: boolean
        lessonCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - id
      - isPublished
      - language
      - lessonCount
      - title
      - updatedAt
    CourseLessonRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        orderIndex:
          type:
          - integer
          - "null"
          format: int32
        plannedDurationMin:
          type:
          - integer
          - "null"
          format: int32
      required:
      - title
    CourseLessonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        title:
          type: string
        orderIndex:
          type:
          - integer
          - "null"
          format: int32
        plannedDurationMin:
          type:
          - integer
          - "null"
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - courseId
      - createdAt
      - id
      - title
      - updatedAt
    MeResponse:
      type: object
      properties:
        subject:
          type: string
        username:
          type:
          - string
          - "null"
        email:
          type:
          - string
          - "null"
        name:
          type:
          - string
          - "null"
        roles:
          type: array
          items:
            type: string
      required:
      - roles
      - subject
    HelloResponse:
      type: object
      properties:
        service:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - message
      - service
      - timestamp
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
