      operationId: getMaterialAssetContent
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material asset content
          content:
