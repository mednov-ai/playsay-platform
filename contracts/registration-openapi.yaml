openapi: 3.0.3
info:
  title: Honey School Registration API
  version: 0.1.0
paths:
  /registration/start:
    post:
      operationId: startRegistration
      summary: Start email registration
      description: Creates or refreshes a pending email registration and sends a confirmation email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRegistrationRequest"
      responses:
        "202":
          description: Generic check-email response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid registration payload.
        "429":
          description: Registration rate limit exceeded.
  /registration/resend:
    post:
      operationId: resendRegistration
      summary: Resend confirmation email
      description: Resends a registration confirmation email when a pending registration exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendRegistrationRequest"
      responses:
        "202":
          description: Generic check-email response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid resend payload.
        "429":
          description: Registration rate limit exceeded.
  /registration/confirm:
    post:
      operationId: confirmRegistration
      summary: Confirm email registration
      description: Confirms a pending registration token and activates the Keycloak student account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRegistrationRequest"
      responses:
        "200":
          description: Confirmed registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid or expired confirmation token.
  /registration/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset code
      description: Sends a generic response and, when an active account exists, sends a one-time password reset code by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Generic check-email response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid password reset request payload.
        "429":
          description: Password reset rate limit exceeded.
  /registration/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password with email code
      description: Verifies a one-time code and updates the Keycloak user password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Invalid code, expired code, or weak password.
  /student-invites/consume:
    post:
      operationId: consumeStudentInvite
      summary: Consume managed-student lesson invite
      description: Exchanges a one-time managed-student invite code for a Keycloak token set and the lesson continue URL. The public link carries the code in the URL fragment, while this request keeps the legacy `token` field name for client compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInviteConsumeRequest"
      responses:
        "200":
          description: Invite consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentInviteConsumeResponse"
        "400":
          description: Invalid, expired, or already consumed invite code.
components:
  schemas:
    StartRegistrationRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          nullable: true
          maxLength: 120
        locale:
          type: string
          nullable: true
          maxLength: 16
        returnTo:
          type: string
          nullable: true
          maxLength: 1024
    ResendRegistrationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        locale:
          type: string
          nullable: true
          maxLength: 16
        returnTo:
          type: string
          nullable: true
          maxLength: 1024
    ConfirmRegistrationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 255
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        locale:
          type: string
          nullable: true
          maxLength: 16
        returnTo:
          type: string
          nullable: true
          maxLength: 1024
    ResetPasswordRequest:
      type: object
      required:
        - email
        - code
        - newPassword
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          minLength: 6
          maxLength: 12
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    RegistrationResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        continueUrl:
          type: string
          nullable: true
    StudentInviteConsumeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: One-time managed-student invite code. New codes are at most 6 characters; longer legacy pending tokens remain accepted for compatibility.
          minLength: 1
          maxLength: 255
    StudentInviteConsumeResponse:
      type: object
      required:
        - accessToken
        - expiresIn
        - continueUrl
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          nullable: true
        idToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64
        continueUrl:
          type: string
