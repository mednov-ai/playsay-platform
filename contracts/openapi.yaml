openapi: 3.1.0
info:
  title: Play&Say API Gateway
  description: Public contract for the Play&Say API Gateway.
  version: 0.1.0
servers:
- url: /api
  description: Play&Say web-app API proxy
paths:
  /users/me/profile:
    get:
      tags:
      - Users
      summary: Current application user profile
      description: Returns the app-level profile for the current Keycloak user.
      operationId: getMyUserProfile
      responses:
        "200":
          description: Current app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    put:
      tags:
      - Users
      summary: Update current application user profile
      description: Updates editable profile fields for the current Keycloak user.
      operationId: updateMyUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
        required: true
      responses:
        "200":
          description: Updated app-level user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: Invalid profile payload
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    delete:
      tags:
      - Users
      summary: Delete current application user profile
      description: Deletes editable app-level profile data for the current Keycloak
        user.
      operationId: deleteMyUserProfile
      responses:
        "204":
          description: Current app-level user profile deleted
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}:
    get:
      tags:
      - Schedule
      summary: Get scheduled lesson
      description: Returns a scheduled lesson visible to the current user.
      operationId: getScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Scheduled lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Schedule
      summary: Update scheduled lesson
      description: Updates a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: updateScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledLessonRequest"
        required: true
      responses:
        "200":
          description: Scheduled lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "400":
          description: Invalid scheduled lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Schedule
      summary: Delete scheduled lesson
      description: Deletes a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: deleteScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Scheduled lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
        "404":
          description: Scheduled lesson not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material-submission:
    get:
      tags:
      - Materials
      summary: Get current material answer snapshot
      description: Returns the current user's saved answers for the material attached
        to a scheduled lesson.
      operationId: getScheduledLessonMaterialSubmission
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSubmissionResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Save current material answer snapshot
      description: Creates or updates the current user's answers for the material
        attached to a scheduled lesson.
      operationId: saveScheduledLessonMaterialSubmission
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialSubmissionRequest"
        required: true
      responses:
        "200":
          description: Material submission saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSubmissionResponse"
        "400":
          description: Invalid submission payload
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/material-annotation:
    get:
      tags:
      - Materials
      summary: Get shared material annotation layer
      description: Returns the shared drawing layer for the material attached to a
        scheduled lesson.
      operationId: getScheduledLessonMaterialAnnotation
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Material annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAnnotationResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Save shared material annotation layer
      description: Creates or updates the shared drawing layer for the material attached
        to a scheduled lesson.
      operationId: saveScheduledLessonMaterialAnnotation
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialAnnotationRequest"
        required: true
      responses:
        "200":
          description: Material annotation saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAnnotationResponse"
        "400":
          description: Invalid annotation payload
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/collaboration-documents/{documentId}/snapshot:
    put:
      tags:
      - Collaboration
      summary: Save collaboration document snapshot
      description: Stores the latest normalized snapshot for a collaboration document
        and increments its version.
      operationId: saveCollaborationDocumentSnapshot
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCollaborationSnapshotRequest"
        required: true
      responses:
        "200":
          description: Snapshot saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationDocumentResponse"
        "400":
          description: Invalid snapshot
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot modify the document
        "404":
          description: Collaboration document not found
      security:
      - bearerAuth: []
  /me/assignments/{assignmentId}/submission:
    get:
      tags:
      - Assignments
      summary: Get my homework answer snapshot
      description: Returns the current student's saved answers for a homework assignment.
      operationId: getMyHomeworkAssignmentSubmission
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmissionResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - Assignments
      summary: Save my homework answer snapshot
      description: Creates or updates the current student's answers and automatic
        score/error snapshot for homework.
      operationId: saveMyHomeworkAssignmentSubmission
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialSubmissionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSubmissionResponse"
      security:
      - bearerAuth: []
  /materials/{materialId}:
    get:
      tags:
      - Materials
      summary: Get lesson material
      description: Returns a visible lesson material.
      operationId: getMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Lesson material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Material not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Materials
      summary: Update lesson material
      description: Updates a structured lesson material. Requires material owner or
        ADMIN role.
      operationId: updateMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonMaterialRequest"
        required: true
      responses:
        "200":
          description: Lesson material updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "400":
          description: Invalid material payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot edit material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Materials
      summary: Archive lesson material
      description: Archives a lesson material. Requires material owner or ADMIN role.
      operationId: archiveMaterial
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Lesson material archived
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot archive material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
  /courses/{courseId}:
    get:
      tags:
      - Courses
      summary: Get course
      description: Returns a single course. Unpublished courses are visible only to
        teachers/admins.
      operationId: getCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    put:
      tags:
      - Courses
      summary: Update course
      description: Updates a course. Requires TEACHER or ADMIN role.
      operationId: updateCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
        required: true
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          description: Invalid course payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course
      description: Deletes a course and its draft lesson templates. Requires TEACHER
        or ADMIN role.
      operationId: deleteCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
  /courses/{courseId}/lessons/{lessonId}:
    put:
      tags:
      - Courses
      summary: Update course lesson
      description: Updates a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: updateCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLessonRequest"
        required: true
      responses:
        "200":
          description: Course lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
        "400":
          description: Invalid course lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
    delete:
      tags:
      - Courses
      summary: Delete course lesson
      description: Deletes a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: deleteCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Course lesson deleted
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course lesson not found
      security:
      - bearerAuth: []
  /schedule/lessons:
    get:
      tags:
      - Schedule
      summary: List scheduled lessons
      description: "Returns scheduled lessons. Teachers/admins see all, students see\
        \ lessons where they are participants."
      operationId: listScheduledLessons
      responses:
        "200":
          description: Scheduled lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledLessonResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    post:
      tags:
      - Schedule
      summary: Create scheduled lesson
      description: Creates a calendar lesson. Requires TEACHER or ADMIN role.
      operationId: createScheduledLesson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledLessonRequest"
        required: true
      responses:
        "201":
          description: Scheduled lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledLessonResponse"
        "400":
          description: Invalid scheduled lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage schedule
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/room-token:
    post:
      tags:
      - Schedule
      summary: Create scheduled lesson video token
      description: Returns a short-lived LiveKit join token for a scheduled lesson
        visible to the current user.
      operationId: createScheduledLessonRoomToken
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: LiveKit room token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitRoomTokenResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Scheduled lesson not found
        "503":
          description: LiveKit is not configured
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/homework:
    post:
      tags:
      - Assignments
      summary: Carry scheduled lesson material into homework
      description: Creates or updates a homework assignment from a scheduled lesson
        material and participants. Requires TEACHER or ADMIN role.
      operationId: createHomeworkFromScheduledLesson
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonHomeworkRequest"
        required: true
      responses:
        "201":
          description: Homework assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAssignmentDetailResponse"
        "400":
          description: Invalid homework payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot create assignments
        "404":
          description: Scheduled lesson or material not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/collaboration-documents/{documentId}/token:
    post:
      tags:
      - Collaboration
      summary: Create collaboration websocket token
      description: Returns a short-lived token scoped to the collaboration document
        room.
      operationId: createCollaborationDocumentToken
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Collaboration token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationTokenResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot join the document
        "404":
          description: Collaboration document not found
        "503":
          description: Collaboration token signing is not configured
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/collaboration-documents/{documentId}/finalize:
    post:
      tags:
      - Collaboration
      summary: Finalize collaboration document
      description: Creates or updates the normal material submission from the latest
        collaboration snapshot.
      operationId: finalizeCollaborationDocument
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeCollaborationDocumentRequest"
        required: true
      responses:
        "200":
          description: Material submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialSubmissionResponse"
        "400":
          description: Invalid document scope or missing snapshot
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot finalize the document
        "404":
          description: Collaboration document not found
      security:
      - bearerAuth: []
  /schedule/lessons/{lessonId}/collaboration-documents/current:
    get:
      tags:
      - Collaboration
      summary: Get current collaboration document
      description: Returns the current user's individual document or the shared group
        document for a scheduled lesson material.
      operationId: getCurrentCollaborationDocument
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: materialId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: documentKind
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Collaboration document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationDocumentResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot access the document
        "404":
          description: Collaboration document not found
      security:
      - bearerAuth: []
    post:
      tags:
      - Collaboration
      summary: Create or get current collaboration document
      description: "Creates the current user's individual document or the shared group\
        \ document if missing, then returns it."
      operationId: createCurrentCollaborationDocument
      parameters:
      - name: lessonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollaborationDocumentRequest"
        required: true
      responses:
        "200":
          description: Collaboration document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationDocumentResponse"
        "400":
          description: Invalid collaboration scope or payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot access the document
      security:
      - bearerAuth: []
  /materials:
    get:
      tags:
      - Materials
      summary: List lesson materials
      description: Teachers/admins see their materials and published public materials.
        Students see published public materials.
      operationId: listMaterials
      responses:
        "200":
          description: Lesson materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
      security:
      - bearerAuth: []
    post:
      tags:
      - Materials
      summary: Create lesson material
      description: Creates a structured lesson material. Requires TEACHER or ADMIN
        role.
      operationId: createMaterial
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonMaterialRequest"
        required: true
      responses:
        "201":
          description: Lesson material created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "400":
          description: Invalid material payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage materials
      security:
      - bearerAuth: []
  /materials/{materialId}/generate-images:
    post:
      tags:
      - Materials
      summary: Generate material images
      description: "Generates missing or regenerated AI illustrations for generated-image\
        \ and matching-pairs material blocks, stores bytes in object storage, and\
        \ updates the material document. Requires material owner or ADMIN role."
      operationId: generateMaterialImages
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialGenerateImagesRequest"
        required: true
      responses:
        "200":
          description: Lesson material with generated images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot edit material
        "404":
          description: Material not found
      security:
      - bearerAuth: []
  /materials/{materialId}/answer-suggestions:
    post:
      tags:
      - Materials
      summary: Suggest accepted answer variants
      description: Suggests additional correct answer variants for selected objective
        material items. Requires material owner or ADMIN role; suggestions are not
        saved until the teacher accepts them.
      operationId: suggestMaterialAcceptedAnswers
      parameters:
      - name: materialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialAnswerSuggestionsRequest"
        required: true
      responses:
        "200":
          description: Suggested accepted answer variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialAnswerSuggestionsResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot edit material
        "404":
          description: Material or block not found
      security:
      - bearerAuth: []
  /materials/import-url:
    post:
      tags:
      - Materials
      summary: Draft lesson material from external URL
      description: "Fetches readable text from an http/https page, then returns a\
        \ structured Play&Say draft through the configured AI provider. Local/private\
        \ hosts are rejected."
      operationId: draftMaterialFromUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUrlImportRequest"
        required: true
      responses:
        "200":
          description: Draft material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonMaterialDraftResponse"
        "400":
          description: Invalid or unreadable external URL
