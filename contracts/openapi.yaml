      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Course lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseLessonResponse"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Course not found
      security:
      - bearerAuth: []
    post:
      tags:
      - Courses
      summary: Create course lesson
      description: Creates a lesson template inside a course. Requires TEACHER or
        ADMIN role.
      operationId: createCourseLesson
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseLessonRequest"
        required: true
      responses:
        "201":
          description: Course lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonResponse"
        "400":
          description: Invalid course lesson payload
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Current user cannot manage courses
        "404":
          description: Course not found
      security:
      - bearerAuth: []
  /assignments:
    get:
      tags:
      - Assignments
