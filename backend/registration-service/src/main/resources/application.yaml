server:
  port: 8085

spring:
  application:
    name: registration-service
  datasource:
    url: ${PLAYSAY_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/playsay}
    username: ${PLAYSAY_DB_USERNAME:playsay_app}
    password: ${PLAYSAY_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_REGISTRATION_LIQUIBASE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.orm.connections.pooling: warn

playsay:
  registration:
    public-base-url: ${PLAYSAY_REGISTRATION_PUBLIC_BASE_URL:https://online.play-and-say.ru}
    token-ttl-hours: ${PLAYSAY_REGISTRATION_TOKEN_TTL_HOURS:24}
    managed-student-invite-retention-days: ${PLAYSAY_REGISTRATION_MANAGED_STUDENT_INVITE_RETENTION_DAYS:30}
    resend-cooldown-seconds: ${PLAYSAY_REGISTRATION_RESEND_COOLDOWN_SECONDS:300}
    password-reset-code-ttl-minutes: ${PLAYSAY_REGISTRATION_PASSWORD_RESET_CODE_TTL_MINUTES:15}
    password-reset-max-attempts: ${PLAYSAY_REGISTRATION_PASSWORD_RESET_MAX_ATTEMPTS:5}
    rate-limit:
      window-seconds: ${PLAYSAY_REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:3600}
      max-per-email: ${PLAYSAY_REGISTRATION_RATE_LIMIT_MAX_PER_EMAIL:20}
      max-per-ip: ${PLAYSAY_REGISTRATION_RATE_LIMIT_MAX_PER_IP:30}
    keycloak:
      base-url: ${PLAYSAY_KEYCLOAK_BASE_URL:https://ops.play-and-say.ru:18443/keycloak}
      realm: ${PLAYSAY_KEYCLOAK_REALM:playsay}
      client-id: ${PLAYSAY_KEYCLOAK_ADMIN_CLIENT_ID:playsay-registration-service}
      client-secret: ${PLAYSAY_KEYCLOAK_ADMIN_CLIENT_SECRET:}
      student-token-client-id: ${PLAYSAY_KEYCLOAK_STUDENT_TOKEN_CLIENT_ID:playsay-web}
    email-service:
      base-url: ${PLAYSAY_EMAIL_SERVICE_BASE_URL:http://email-service:8086}
      service-token: ${PLAYSAY_EMAIL_SERVICE_TOKEN:}
