server:
  port: 8084

spring:
  application:
    name: keyboard-service
  datasource:
    url: ${PLAYSAY_KEYBOARD_DB_JDBC_URL:jdbc:postgresql://playsay-postgres-rw.playsay-data.svc.cluster.local:5432/keyboard}
    username: ${PLAYSAY_KEYBOARD_DB_USERNAME:keyboard_app}
    password: ${PLAYSAY_KEYBOARD_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${PLAYSAY_KEYBOARD_LIQUIBASE_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PLAYSAY_AUTH_ISSUER_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay}
          jwk-set-uri: ${PLAYSAY_AUTH_JWK_SET_URI:https://ops.play-and-say.ru:18443/keycloak/realms/playsay/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.orm.connections.pooling: warn

playsay:
  user-data:
    service-token: ${PLAYSAY_USER_DATA_SERVICE_TOKEN:}
  vocabulary-integration:
    base-url: ${PLAYSAY_VOCABULARY_SERVICE_BASE_URL:http://vocabulary-service.playsay-dev.svc.cluster.local}
    retry-delay-ms: ${PLAYSAY_VOCABULARY_RESULT_RETRY_DELAY_MS:10000}
  keyboard:
    anonymous:
      fingerprint-secret: ${PLAYSAY_KEYBOARD_ANONYMOUS_FINGERPRINT_SECRET:dev-keyboard-anonymous}
    ai:
      provider: ${PLAYSAY_KEYBOARD_AI_PROVIDER:}
      model: ${PLAYSAY_KEYBOARD_AI_MODEL:}
      api-key: ${PLAYSAY_KEYBOARD_AI_API_KEY:}
      base-url: ${PLAYSAY_KEYBOARD_AI_BASE_URL:https://api.openai.com/v1}
